<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Minutes - UPAA District 17</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .section-header { font-family: 'Playfair Display', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Navbar (same as before) -->
    <nav class="bg-white border-b shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-x-4">
                    <img src="logo.png" alt="UPAA District 17 Logo" class="w-16 h-16 object-contain">
                    <div>
                        <h1 class="text-2xl font-semibold text-[#003366]">UPAA District 17</h1>
                        <p class="text-xs text-slate-500">Upper Peninsula • Area 74</p>
                    </div>
                </div>
                <div class="flex gap-x-6 text-sm font-medium">
                    <a href="index.html">Home</a>
                    <a href="meetings.html">Meetings</a>
                    <a href="minutes.html" class="font-semibold text-[#003366]">Minutes</a>
                    <a href="events.html">Events</a>
                    <a href="contact.html">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Password Screen -->
    <div id="login-screen" class="min-h-[70vh] flex items-center justify-center bg-slate-100">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-10 text-center">
            <h2 class="text-3xl font-bold text-[#003366] mb-4">Meeting Minutes</h2>
            <p class="text-slate-600 mb-8">Restricted to District 17 GSRs only.</p>
            
            <input type="password" id="pwd" 
                   class="w-full px-6 py-4 border border-slate-300 rounded-2xl text-lg focus:outline-none focus:border-[#003366] mb-6"
                   placeholder="Enter password (8+ characters)">
            
            <button onclick="checkPassword()" 
                    class="w-full bg-[#003366] text-white py-4 rounded-2xl font-semibold hover:bg-[#002244]">
                Access Minutes
            </button>
            
            <p id="error-msg" class="text-red-500 mt-4 hidden">Incorrect password.</p>
        </div>
    </div>

    <!-- Protected Minutes Content -->
    <div id="content" class="hidden max-w-4xl mx-auto px-6 py-12">
        <h1 class="section-header text-4xl font-bold text-[#003366] mb-10 text-center">District 17 Meeting Minutes</h1>
        
        <div class="prose max-w-none bg-white p-8 rounded-3xl shadow">
            <!-- Paste your actual minutes here -->
        </div>
    </div>

    <script>
        const correctPassword = "@Dist17!";   // ← CHANGE THIS (min 8 chars + special character)

        function checkPassword() {
            const input = document.getElementById("pwd").value;
            const errorMsg = document.getElementById("error-msg");

            if (input === correctPassword) {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("content").classList.remove("hidden");
                sessionStorage.setItem("authenticated", "true");
            } else {
                errorMsg.classList.remove("hidden");
                document.getElementById("pwd").value = "";
            }
        }

        // Enter key support
        document.getElementById("pwd").addEventListener("keypress", (e) => {
            if (e.key === "Enter") checkPassword();
        });

        // Remember during session
        if (sessionStorage.getItem("authenticated") === "true") {
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("content").classList.remove("hidden");
        }
    </script>

</body>
</html>
